[project]
name = "tutorials-imsc-2026"
version = "0.1.0"
description = "IMSC 2026 workshop tutorials: AI for MS-based proteomics"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "deeplc>=3.1.3",
    "gdown>=6.1.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.9",
    "ms2pip>=4.1.2",
    "ms2rescore>=3.2.0.post1",
    "mzpeak",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "psm-utils>=1.5.5",
    "pyarrow>=25",
    "pyteomics>=4.7.5",
    "ristretto>=0.1.2",
    "seaborn>=0.13.2",
    "spectrum-utils>=0.5.0",
]

[tool.uv.extra-build-dependencies]
ristretto = ["Cython"]

[tool.uv.sources]
mzpeak = { git = "https://github.com/HUPO-PSI/mzPeak.git", rev = "f68baac793a61592cbbd794a0ef26f2d2b6fac3d", subdirectory = "python" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
]
